<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="KirbyDay">
  <meta name="theme-color" content="#0969da">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="src/icons/icon-192.png">
  <title>KirbyDay</title>
  <link rel="stylesheet" href="src/css/base.css">
  <link rel="stylesheet" href="src/css/layout.css">
  <link rel="stylesheet" href="src/css/calendar.css">
  <link rel="stylesheet" href="src/css/tasks.css">
  <link rel="stylesheet" href="src/css/kirby.css">
  <link rel="stylesheet" href="src/css/settings.css">
  <link rel="stylesheet" href="src/css/themes.css">
</head>
<body>
  <!-- Header -->
  <header id="app-header" class="app-header">
    <div class="header-left">
      <button id="btn-today" class="header-btn" aria-label="回到今天">今天</button>
    </div>
    <h1 id="header-title" class="header-title">2026年1月</h1>
    <div class="header-right">
      <button id="btn-add-task" class="header-btn icon-btn" aria-label="添加任务">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-search" class="header-btn icon-btn" aria-label="搜索">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="9" cy="9" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M13 13l4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <!-- Main Content Area -->
  <main id="app-main" class="app-main">

    <!-- Tab: Tasks -->
    <section id="tab-tasks" class="tab-panel active">
      <div class="task-filters">
        <button class="filter-chip active" data-filter="all">全部</button>
        <button class="filter-chip" data-filter="today">今天</button>
        <button class="filter-chip" data-filter="week">本周</button>
        <button class="filter-chip" data-filter="overdue">逾期</button>
      </div>
      <div id="task-list" class="task-list">
        <div class="empty-state">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none"><rect x="8" y="6" width="32" height="36" rx="4" stroke="#d0d7de" stroke-width="2"/><path d="M16 18h16M16 26h10" stroke="#d0d7de" stroke-width="2" stroke-linecap="round"/></svg>
          <p>暂无任务</p>
          <span>点击右上角 + 添加新任务</span>
        </div>
      </div>
    </section>

    <!-- Tab: Calendar View -->
    <section id="tab-calendar" class="tab-panel">
      <div class="view-switcher">
        <button class="view-btn active" data-view="day">日</button>
        <button class="view-btn" data-view="3day">三日</button>
        <button class="view-btn" data-view="week">周</button>
        <button class="view-btn" data-view="month">月</button>
      </div>
      <div id="calendar-container" class="calendar-container">
        <!-- Calendar rendered by JS -->
      </div>
    </section>

    <!-- Tab: Kirby (AI Chat) -->
    <section id="tab-kirby" class="tab-panel">
      <div id="kirby-chat" class="kirby-chat">
        <div class="kirby-welcome">
          <svg width="56" height="56" viewBox="0 0 56 56" fill="none"><circle cx="28" cy="28" r="24" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/><circle cx="20" cy="24" r="3" fill="#1f2328"/><circle cx="36" cy="24" r="3" fill="#1f2328"/><path d="M20 34c2 4 6 6 8 6s6-2 8-6" stroke="#1f2328" stroke-width="2" stroke-linecap="round"/></svg>
          <h2>你好，我是卡比!</h2>
          <p>发给我一段安排，我帮你提取成日程</p>
          <p class="kirby-hint">请先在设置中配置 API</p>
        </div>
        <div id="kirby-messages" class="kirby-messages"></div>
      </div>
      <div class="kirby-input-area">
        <textarea id="kirby-input" class="kirby-input" placeholder="粘贴安排或输入消息..." rows="2"></textarea>
        <button id="kirby-send" class="kirby-send-btn" aria-label="发送">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 10l14-7-7 14v-7H3z" fill="currentColor"/></svg>
        </button>
      </div>
    </section>

    <!-- Tab: Settings -->
    <section id="tab-settings" class="tab-panel">
      <div id="settings-main" class="settings-page">
        <div class="settings-group">
          <div class="settings-group-title">通用</div>
          <div class="settings-item" data-setting="general">
            <div class="settings-item-left">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M10 6v4l3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              <span>通用设置</span>
            </div>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
          <div class="settings-item" data-setting="theme">
            <div class="settings-item-left">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M3 10h14" stroke="currentColor" stroke-width="1.5"/><path d="M10 3v14" stroke="currentColor" stroke-width="1.5"/></svg>
              <span>主题</span>
            </div>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
          <div class="settings-item" data-setting="display">
            <div class="settings-item-left">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="2" y="4" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 17h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              <span>显示</span>
            </div>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
        </div>
        <div class="settings-group">
          <div class="settings-group-title">AI 助手</div>
          <div class="settings-item" data-setting="api">
            <div class="settings-item-left">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M4 7h12M4 13h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="7" r="2" fill="currentColor"/><circle cx="13" cy="13" r="2" fill="currentColor"/></svg>
              <span>API 配置</span>
            </div>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 4l4 4-4 4" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/></svg>
          </div>
        </div>
        <div class="settings-group">
          <div class="settings-group-title">关于</div>
          <div class="settings-item disabled">
            <div class="settings-item-left">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M10 9v4M10 7h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              <span>KirbyDay v1.0</span>
            </div>
          </div>
        </div>
      </div>
      <!-- Sub: General Settings -->
      <div id="settings-general" class="settings-sub hidden">
        <div class="settings-sub-header">
          <button class="settings-back" aria-label="返回">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <h2>通用设置</h2>
        </div>
        <div class="settings-group">
          <div class="form-row">
            <label>周起始日</label>
            <select id="setting-week-start" class="form-input">
              <option value="0">周日</option>
              <option value="1" selected>周一</option>
              <option value="6">周六</option>
            </select>
          </div>
          <div class="form-row">
            <label>默认视图</label>
            <select id="setting-default-view" class="form-input">
              <option value="day">日视图</option>
              <option value="3day">三日视图</option>
              <option value="week" selected>周视图</option>
              <option value="month">月视图</option>
            </select>
          </div>
          <div class="form-row">
            <label>默认提醒</label>
            <select id="setting-reminder" class="form-input">
              <option value="0">无</option>
              <option value="5">5分钟前</option>
              <option value="15" selected>15分钟前</option>
              <option value="30">30分钟前</option>
              <option value="60">1小时前</option>
            </select>
          </div>
        </div>
      </div>
      <!-- Sub: Theme Settings -->
      <div id="settings-theme" class="settings-sub hidden">
        <div class="settings-sub-header">
          <button class="settings-back" aria-label="返回">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <h2>主题</h2>
        </div>
        <div class="theme-grid">
          <div class="theme-card active" data-theme="default">
            <div class="theme-preview theme-preview-default"></div>
            <span>经典</span>
          </div>
          <div class="theme-card" data-theme="ocean">
            <div class="theme-preview theme-preview-ocean"></div>
            <span>海洋</span>
          </div>
          <div class="theme-card" data-theme="forest">
            <div class="theme-preview theme-preview-forest"></div>
            <span>森林</span>
          </div>
        </div>
      </div>
      <!-- Sub: Display Settings -->
      <div id="settings-display" class="settings-sub hidden">
        <div class="settings-sub-header">
          <button class="settings-back" aria-label="返回">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <h2>显示</h2>
        </div>
        <div class="settings-group">
          <div class="form-row toggle-row">
            <label>深色模式</label>
            <button id="setting-dark-mode" class="toggle-btn" role="switch" aria-checked="false">
              <span class="toggle-knob"></span>
            </button>
          </div>
          <div class="form-row toggle-row">
            <label>显示农历</label>
            <button id="setting-lunar" class="toggle-btn on" role="switch" aria-checked="true">
              <span class="toggle-knob"></span>
            </button>
          </div>
          <div class="form-row toggle-row">
            <label>显示节假日</label>
            <button id="setting-holidays" class="toggle-btn on" role="switch" aria-checked="true">
              <span class="toggle-knob"></span>
            </button>
          </div>
          <div class="form-row toggle-row">
            <label>显示周数</label>
            <button id="setting-weeknum" class="toggle-btn" role="switch" aria-checked="false">
              <span class="toggle-knob"></span>
            </button>
          </div>
        </div>
      </div>
      <!-- Sub: API Settings -->
      <div id="settings-api" class="settings-sub hidden">
        <div class="settings-sub-header">
          <button class="settings-back" aria-label="返回">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <h2>API 配置</h2>
        </div>
        <div class="settings-group">
          <div class="form-row vertical">
            <label>API URL</label>
            <input id="setting-api-url" type="url" class="form-input" placeholder="https://api.openai.com/v1">
          </div>
          <div class="form-row vertical">
            <label>API Key</label>
            <input id="setting-api-key" type="password" class="form-input" placeholder="sk-...">
          </div>
          <button id="btn-fetch-models" class="btn-secondary">拉取模型列表</button>
          <div class="form-row vertical">
            <label>模型</label>
            <select id="setting-model" class="form-input">
              <option value="">请先拉取模型列表</option>
            </select>
          </div>
          <button id="btn-save-api" class="btn-primary">保存配置</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Add Task Modal -->
  <div id="modal-add-task" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>新建任务</h2>
        <button id="modal-close" class="icon-btn" aria-label="关闭">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
      <form id="task-form" class="task-form">
        <input id="task-title" type="text" class="form-input" placeholder="任务标题" required>
        <textarea id="task-note" class="form-input form-textarea" placeholder="备注" rows="2"></textarea>
        <div class="form-row">
          <label>日期</label>
          <input id="task-date" type="date" class="form-input">
        </div>
        <div class="form-row">
          <label>时间</label>
          <div class="time-row">
            <input id="task-start" type="time" class="form-input">
            <span>至</span>
            <input id="task-end" type="time" class="form-input">
          </div>
        </div>
        <div class="form-row">
          <label>优先级</label>
          <select id="task-priority" class="form-input">
            <option value="0">无</option>
            <option value="1">低</option>
            <option value="2">中</option>
            <option value="3">高</option>
          </select>
        </div>
        <div class="form-row">
          <label>地点</label>
          <input id="task-location" type="text" class="form-input" placeholder="可选">
        </div>
        <div class="form-row">
          <label>颜色</label>
          <div id="color-picker" class="color-picker"></div>
        </div>
        <button type="submit" class="btn-primary form-submit">保存</button>
      </form>
    </div>
  </div>

  <!-- Bottom Tab Bar -->
  <nav id="tab-bar" class="tab-bar">
    <button class="tab-item active" data-tab="tasks">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="3" y="3" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M7 11l2.5 2.5L15 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>任务</span>
    </button>
    <button class="tab-item" data-tab="calendar">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="3" y="4" width="16" height="15" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M3 9h16M7 3v3M15 3v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>视图</span>
    </button>
    <button class="tab-item" data-tab="kirby">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="10" r="1.5" fill="currentColor"/><circle cx="14" cy="10" r="1.5" fill="currentColor"/><path d="M8 14c1 1.5 2.5 2 3 2s2-.5 3-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>卡比</span>
    </button>
    <button class="tab-item" data-tab="settings">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M11 2v3M11 17v3M2 11h3M17 11h3M4.93 4.93l2.12 2.12M14.95 14.95l2.12 2.12M4.93 17.07l2.12-2.12M14.95 7.05l2.12-2.12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>设置</span>
    </button>
  </nav>

  <script src="src/script/storage.js"></script>
  <script src="src/script/holidays.js"></script>
  <script src="src/script/router.js"></script>
  <script src="src/script/tasks.js"></script>
  <script src="src/script/calendar.js"></script>
  <script src="src/script/kirby.js"></script>
  <script src="src/script/settings.js"></script>
  <script src="src/script/app.js"></script>
</body>
</html>
