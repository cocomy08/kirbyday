<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KirbyDay">
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="src/icons/icon-192.svg">
  <title>KirbyDay</title>
  <link rel="stylesheet" href="src/css/base.css">
  <link rel="stylesheet" href="src/css/layout.css">
  <link rel="stylesheet" href="src/css/calendar.css">
  <link rel="stylesheet" href="src/css/tasks.css">
  <link rel="stylesheet" href="src/css/kirby.css">
  <link rel="stylesheet" href="src/css/settings.css">
  <link rel="stylesheet" href="src/css/themes.css">
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="i-add" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18.5 9.5a2.12 2.12 0 0 0-3-3L5 17v3z"/><path d="M13.5 6.5l3 3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></symbol>
    <symbol id="i-tasks" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 12l2.5 2.5L16 9"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h9M17 17h3"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="15" cy="17" r="2"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" fill="currentColor" opacity="0.16"/><ellipse cx="8.8" cy="11.6" rx="1.5" ry="2.1" fill="currentColor"/><ellipse cx="15.2" cy="11.6" rx="1.5" ry="2.1" fill="currentColor"/><path d="M9.6 15.4c1.1 1 3.7 1 4.8 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="6.6" cy="15.9" r="1.5" fill="currentColor" opacity="0.35"/><circle cx="17.4" cy="15.9" r="1.5" fill="currentColor" opacity="0.35"/></symbol>
    <symbol id="i-today" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v3M16 3v3"/><circle cx="12" cy="15" r="1.3" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-location" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-5.5-7-11a7 7 0 0 1 14 0c0 5.5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h8l10 10-8 8L3 11V3z"/><circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 21h16"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9M7 14l5-5 5 5"/><path d="M4 3h16"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l1.8 5.4L19 10l-5.2 1.6L12 17l-1.8-5.4L5 10l5.2-1.6z"/><path d="M18.5 15l.9 2.6L22 18.5l-2.6.9-.9 2.6-.9-2.6L15 18.5l2.6-.9z"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9L4 9"/><path d="M4 4v5h5"/><path d="M12 8v4l3 2"/></symbol>
    <symbol id="i-period" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2C12 3.2 6.5 9.4 6.5 14.2a5.5 5.5 0 0 0 11 0C17.5 9.4 12 3.2 12 3.2z"/></symbol>
  </svg>
  <header id="app-header" class="app-header">
    <div class="header-title-block">
      <p id="header-subtitle" class="header-subtitle"></p>
    </div>
    <div class="header-actions">
      <button id="btn-today" class="header-btn hidden" aria-label="今天">今天</button>
      <button id="btn-history" class="icon-btn hidden" aria-label="历史对话">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-history"/></svg>
      </button>
    </div>
  </header>

  <main id="app-main" class="app-main">
    <!-- Tab: Tasks -->
    <section id="tab-tasks" class="tab-panel active">
      <div class="task-filters">
        <button class="filter-chip active" data-filter="all">全部</button>
        <button class="filter-chip" data-filter="today">今天</button>
        <button class="filter-chip" data-filter="week">本周</button>
        <button class="filter-chip" data-filter="overdue">逾期</button>
      </div>
      <div id="task-list" class="task-list"></div>
    </section>

    <!-- Tab: Calendar -->
    <section id="tab-calendar" class="tab-panel">
      <div class="view-switcher">
        <select id="view-select" class="view-select" aria-label="切换视图">
          <option value="day">日</option>
          <option value="3day">三日</option>
          <option value="week" selected>周</option>
          <option value="weeklist">周列表</option>
          <option value="month">月</option>
        </select>
      </div>
      <div id="calendar-container" class="calendar-container"></div>
    </section>

    <!-- Tab: Kirby -->
    <section id="tab-kirby" class="tab-panel">
      <div id="kirby-chat" class="kirby-chat">
        <div class="kirby-welcome">
          <div class="kirby-mascot" id="kirby-mascot"></div>
          <h2>你好，我是卡比!</h2>
          <p>发给我一段文字，帮你提取成日程</p>
          <p class="kirby-hint">请先在设置中配置 API</p>
        </div>
        <div id="kirby-messages" class="kirby-messages"></div>
      </div>
      <div id="kirby-history" class="history-panel hidden">
        <div class="history-header">
          <button class="settings-back" id="history-back" aria-label="返回"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
          <h2>历史对话</h2>
        </div>
        <div class="history-search">
          <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="history-search-input" type="text" placeholder="搜索对话记录..." autocomplete="off">
        </div>
        <div id="history-list" class="history-list"></div>
      </div>
      <div class="kirby-input-area">
        <textarea id="kirby-input" class="kirby-input" placeholder="粘贴安排或输入消息..." rows="1"></textarea>
        <button id="kirby-send" class="kirby-send-btn" aria-label="发送">
          <svg viewBox="0 0 1024 1024" fill="currentColor"><path d="M921.472 108.48c-19.904-21.44-51.2-29.504-81.088-32.384-31.36-3.008-68.992-1.024-109.44 4.288-81.152 10.624-179.2 35.264-273.472 65.6-94.272 30.336-186.176 66.88-254.976 101.824-34.24 17.408-64 35.072-85.568 51.968a156.928 156.928 0 0 0-27.904 27.136c-7.04 9.216-14.464 22.4-14.336 38.144 0.256 41.472 28.48 70.784 58.56 90.432 30.72 20.096 70.72 35.2 110.464 47.104 40.128 11.968 82.432 21.248 118.72 28.8l12.992 2.688c21.952 4.48 32.896 6.784 43.264 3.712 10.24-3.136 18.24-11.072 34.112-26.88l157.056-157.056a42.688 42.688 0 0 1 60.288 60.288L523.712 560.64c-16.192 16.192-24.32 24.256-27.328 34.752-3.072 10.496-0.64 21.632 4.352 43.904 19.136 86.4 35.776 157.76 52.352 205.824 9.6 28.032 20.544 52.352 34.368 70.208 14.336 18.688 33.92 32.832 59.712 33.92 16 0.768 29.44-6.592 38.528-13.376 9.664-7.168 18.752-16.768 27.136-27.264 16.896-21.12 34.624-50.304 52.288-84.096 35.52-67.84 73.088-158.784 104.96-252.352 31.744-93.568 58.24-191.104 71.04-272.192 6.336-40.448 9.472-78.016 7.68-109.44-1.6-29.888-7.936-61.184-27.328-82.048z"/></svg>
        </button>
      </div>
    </section>

    <!-- Tab: Settings -->
    <section id="tab-settings" class="tab-panel">
      <div id="settings-main" class="settings-page">
        <div class="settings-group">
          <div class="settings-group-title">通用</div>
          <div class="settings-card">
            <div class="settings-item" data-setting="general">
              <div class="settings-item-left">
                <div class="si-icon blue"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sliders"/></svg></div>
                <span>通用设置</span>
              </div>
              <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-right"/></svg>
            </div>
            <div class="settings-item" data-setting="display">
              <div class="settings-item-left">
                <div class="si-icon green"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-monitor"/></svg></div>
                <span>显示</span>
              </div>
              <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-right"/></svg>
            </div>
            <div class="settings-item" data-setting="theme">
              <div class="settings-item-left">
                <div class="si-icon purple"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sun"/></svg></div>
                <span>主题</span>
              </div>
              <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-right"/></svg>
            </div>
          </div>
        </div>
        <div class="settings-group">
          <div class="settings-group-title">AI 助手</div>
          <div class="settings-card">
            <div class="settings-item" data-setting="api">
              <div class="settings-item-left">
                <div class="si-icon orange"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-sparkle"/></svg></div>
                <span>API 配置</span>
              </div>
              <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-right"/></svg>
            </div>
          </div>
        </div>
        <div class="settings-group">
          <div class="settings-group-title">健康</div>
          <div class="settings-card">
            <div class="settings-item" data-setting="period">
              <div class="settings-item-left">
                <div class="si-icon pink"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-period"/></svg></div>
                <span>生理期</span>
              </div>
              <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-right"/></svg>
            </div>
          </div>
        </div>
        <div class="settings-group">
          <div class="settings-group-title">数据</div>
          <div class="settings-card">
            <div class="settings-item" data-setting="data">
              <div class="settings-item-left">
                <div class="si-icon red"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-download"/></svg></div>
                <span>数据管理</span>
              </div>
              <svg class="chevron" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-right"/></svg>
            </div>
          </div>
        </div>
        <div class="settings-group">
          <div class="settings-card">
            <div class="settings-item disabled">
              <div class="settings-item-left">
                <div class="si-icon blue"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-info"/></svg></div>
                <span>KirbyDay v3.1.1</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Sub: General -->
      <div id="settings-general" class="settings-sub hidden">
        <div class="settings-sub-header">
          <button class="settings-back" aria-label="返回"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
          <h2>通用设置</h2>
        </div>
        <div class="settings-card" style="margin-bottom:12px">
          <div class="form-row" style="padding:14px 16px;border-bottom:0.5px solid var(--separator)">
            <label>周起始日</label>
            <select id="setting-week-start" class="form-input" style="width:auto;flex:none">
              <option value="0">周日</option><option value="1" selected>周一</option><option value="6">周六</option>
            </select>
          </div>
          <div class="form-row" style="padding:14px 16px;border-bottom:0.5px solid var(--separator)">
            <label>默认视图</label>
            <select id="setting-default-view" class="form-input" style="width:auto;flex:none">
              <option value="day">日</option><option value="3day">三日</option><option value="week" selected>周</option><option value="weeklist">周列表</option><option value="month">月</option>
            </select>
          </div>
          <div class="form-row" style="padding:14px 16px">
            <label>默认提醒</label>
            <select id="setting-reminder" class="form-input" style="width:auto;flex:none">
              <option value="0">无</option><option value="5">5分钟前</option><option value="15" selected>15分钟前</option><option value="30">30分钟前</option><option value="60">1小时前</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Sub: Display -->
      <div id="settings-display" class="settings-sub hidden">
        <div class="settings-sub-header">
          <button class="settings-back" aria-label="返回"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
          <h2>显示</h2>
        </div>
        <div class="toggle-row" style="border-radius:var(--radius-md) var(--radius-md) 0 0">
          <label>深色模式</label>
          <button id="setting-dark-mode" class="toggle-btn" role="switch" aria-checked="false"><span class="toggle-knob"></span></button>
        </div>
        <div class="toggle-row">
          <label>显示农历</label>
          <button id="setting-lunar" class="toggle-btn on" role="switch" aria-checked="true"><span class="toggle-knob"></span></button>
        </div>
        <div class="toggle-row">
          <label>显示节假日</label>
          <button id="setting-holidays" class="toggle-btn on" role="switch" aria-checked="true"><span class="toggle-knob"></span></button>
        </div>
        <div class="toggle-row" style="border-radius:0 0 var(--radius-md) var(--radius-md);border-bottom:none">
          <label>显示周数</label>
          <button id="setting-weeknum" class="toggle-btn" role="switch" aria-checked="false"><span class="toggle-knob"></span></button>
        </div>
      </div>

      <!-- Sub: Theme -->
      <div id="settings-theme" class="settings-sub hidden">
        <div class="settings-sub-header">
          <button class="settings-back" aria-label="返回"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
          <h2>主题</h2>
        </div>
        <div class="theme-grid">
          <div class="theme-card active" data-theme="default"><div class="theme-preview theme-preview-default"></div><span>极简</span></div>
          <div class="theme-card" data-theme="notion"><div class="theme-preview theme-preview-notion"></div><span>Notion</span></div>
          <div class="theme-card" data-theme="corporate"><div class="theme-preview theme-preview-corporate"></div><span>企业</span></div>
          <div class="theme-card" data-theme="ocean"><div class="theme-preview theme-preview-ocean"></div><span>海洋</span></div>
          <div class="theme-card" data-theme="kirby"><div class="theme-preview theme-preview-kirby"></div><span>卡比</span></div>
          <div class="theme-card" data-theme="animal"><div class="theme-preview theme-preview-animal"></div><span>动森</span></div>
        </div>
      </div>

      <!-- Sub: API -->
      <div id="settings-api" class="settings-sub hidden">
        <div class="settings-sub-header">
          <button class="settings-back" aria-label="返回"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
          <h2>API 配置</h2>
        </div>
        <p class="api-hint">配置大模型接口后，卡比才能帮你把文字提取成日程。</p>
        <div class="settings-card api-card">
          <div class="api-field">
            <label>API URL</label>
            <input id="setting-api-url" type="url" class="form-input" placeholder="https://api.openai.com/v1">
          </div>
          <div class="api-field">
            <label>API Key</label>
            <input id="setting-api-key" type="password" class="form-input" placeholder="sk-...">
          </div>
          <div class="api-row">
            <button id="btn-fetch-models" class="btn-secondary" style="margin-bottom:0">拉取模型列表</button>
          </div>
          <div class="api-field">
            <label>模型</label>
            <select id="setting-model" class="form-input"><option value="">请先拉取模型</option></select>
          </div>
        </div>
        <button id="btn-save-api" class="btn-primary">保存配置</button>
      </div>

      <!-- Sub: Period -->
      <div id="settings-period" class="settings-sub hidden">
        <div class="settings-sub-header">
          <button class="settings-back" aria-label="返回"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
          <h2>生理期</h2>
        </div>

        <div class="settings-card" style="margin-bottom:12px">
          <div class="form-row" style="padding:14px 16px;border-bottom:0.5px solid var(--separator)">
            <label>周期天数</label>
            <select id="setting-period-cycle" class="form-input" style="width:auto;flex:none"></select>
          </div>
          <div class="form-row" style="padding:14px 16px">
            <label>经期天数</label>
            <select id="setting-period-days" class="form-input" style="width:auto;flex:none"></select>
          </div>
        </div>

        <div class="settings-group-title">经期记录</div>
        <button id="btn-period-add" class="btn-secondary" style="margin-bottom:10px">＋ 记录经期</button>

        <div id="period-form" class="settings-card hidden" style="padding:16px;margin-bottom:12px">
          <input type="hidden" id="period-edit-id" value="">
          <div class="form-row vertical" style="margin-bottom:10px"><label>开始日期</label><input id="period-start" type="date" class="form-input"></div>
          <div class="form-row vertical" style="margin-bottom:10px"><label>开始时间（具体什么时候来的）</label><input id="period-start-time" type="time" class="form-input"></div>
          <div class="form-row vertical" style="margin-bottom:14px"><label>持续天数</label><select id="period-days" class="form-input"></select></div>
          <div style="display:flex;gap:8px">
            <button id="period-save" class="btn-primary" style="flex:1;margin:0">保存</button>
            <button id="period-cancel" class="btn-secondary" style="flex:1;margin:0">取消</button>
          </div>
        </div>

        <div id="period-list"></div>
        <p id="period-predict" class="period-predict"></p>
      </div>

      <!-- Sub: Data Management -->
      <div id="settings-data" class="settings-sub hidden">
        <div class="settings-sub-header">
          <button class="settings-back" aria-label="返回"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
          <h2>数据管理</h2>
        </div>
        <div class="settings-card" style="padding:16px;margin-bottom:16px">
          <div id="storage-info">
            <div style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:8px">存储用量</div>
            <div class="storage-meter"><div class="storage-meter-fill" style="width:0%"></div></div>
            <div class="storage-label">计算中...</div>
          </div>
        </div>
        <div class="data-actions">
          <button id="btn-export" class="btn-secondary" style="margin-bottom:0">备份数据</button>
          <button id="btn-import" class="btn-secondary" style="margin-bottom:0">导入数据</button>
          <input type="file" id="import-file" accept=".bck" class="hidden">
          <button id="btn-clear-data" class="btn-danger">清除所有数据</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Add/Edit Task Modal -->
  <div id="modal-task" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-task-title">新建任务</h2>
        <button id="modal-close" class="icon-btn" aria-label="关闭">
          <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg>
        </button>
      </div>
      <form id="task-form" class="task-form">
        <input type="hidden" id="task-edit-id" value="">
        <div class="form-row vertical">
          <input id="task-title" type="text" class="form-input" placeholder="任务标题" required>
        </div>
        <div class="form-row vertical">
          <textarea id="task-note" class="form-input form-textarea" placeholder="备注" rows="2"></textarea>
        </div>
        <div class="form-row">
          <label>日期</label>
          <input id="task-date" type="date" class="form-input">
        </div>
        <div class="form-row">
          <label>时间</label>
          <div class="time-row">
            <input id="task-start" type="time" class="form-input">
            <span>—</span>
            <input id="task-end" type="time" class="form-input">
          </div>
        </div>
        <div class="form-row">
          <label>优先级</label>
          <select id="task-priority" class="form-input">
            <option value="0">无</option>
            <option value="1">低</option>
            <option value="2">中</option>
            <option value="3">高</option>
          </select>
        </div>
        <div class="form-row">
          <label>重复</label>
          <select id="task-repeat" class="form-input">
            <option value="">不重复</option>
            <option value="daily">每天</option>
            <option value="weekly">每周</option>
            <option value="monthly">每月</option>
            <option value="yearly">每年</option>
          </select>
        </div>
        <div class="form-row hidden" id="repeat-options">
          <label>间隔</label>
          <input id="task-repeat-interval" type="number" class="form-input" min="1" step="1" value="1">
        </div>
        <div class="form-row hidden" id="repeat-end-row">
          <label>结束</label>
          <input id="task-repeat-end" type="date" class="form-input">
        </div>
        <div class="form-row">
          <label>地点</label>
          <input id="task-location" type="text" class="form-input" placeholder="可选">
        </div>
        <div class="form-row">
          <label>颜色</label>
          <div id="color-picker" class="color-picker"></div>
        </div>
        <button type="submit" class="btn-primary form-submit" id="task-submit-btn">保存</button>
        <button type="button" id="task-delete-btn" class="btn-danger hidden" style="margin-top:8px">删除任务</button>
      </form>
    </div>
  </div>

  <!-- Bottom Tab Bar -->
  <nav id="tab-bar" class="tab-bar">
    <button class="tab-item active" data-tab="tasks">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-tasks"/></svg>
      <span>任务</span>
    </button>
    <button class="tab-item" data-tab="calendar">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-calendar"/></svg>
      <span>视图</span>
    </button>
    <button id="fab-add" class="tab-fab" aria-label="添加任务">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><use href="#i-add"/></svg>
    </button>
    <button class="tab-item" data-tab="kirby">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chat"/></svg>
      <span>卡比</span>
    </button>
    <button class="tab-item" data-tab="settings">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-settings"/></svg>
      <span>设置</span>
    </button>
  </nav>

  <!-- Update toast -->
  <div id="update-toast" class="update-toast hidden">
    <span>发现新版本</span>
    <button id="update-btn">立即更新</button>
  </div>

  <script src="src/script/storage.js"></script>
  <script src="src/script/icons.js"></script>
  <script src="src/script/recurrence.js"></script>
  <script src="src/script/holidays.js"></script>
  <script src="src/script/period.js"></script>
  <script src="src/script/router.js"></script>
  <script src="src/script/tasks.js"></script>
  <script src="src/script/calendar.js"></script>
  <script src="src/script/kirby.js"></script>
  <script src="src/script/settings.js"></script>
  <script src="src/script/app.js"></script>
</body>
</html>
