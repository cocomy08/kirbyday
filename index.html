<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="KirbyDay">
  <meta name="theme-color" content="#f2f2f7">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="src/icons/icon-192.png">
  <title>KirbyDay</title>
  <link rel="stylesheet" href="src/css/base.css">
  <link rel="stylesheet" href="src/css/layout.css">
  <link rel="stylesheet" href="src/css/calendar.css">
  <link rel="stylesheet" href="src/css/tasks.css">
  <link rel="stylesheet" href="src/css/kirby.css">
  <link rel="stylesheet" href="src/css/settings.css">
  <link rel="stylesheet" href="src/css/themes.css">
</head>
<body>
  <header id="app-header" class="app-header">
    <div class="header-left">
      <button id="btn-today" class="header-btn hidden" aria-label="今天">今天</button>
    </div>
    <h1 id="header-title" class="header-title">任务</h1>
    <div class="header-right">
      <button id="btn-add-task" class="icon-btn" aria-label="添加任务">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 4v14M4 11h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main id="app-main" class="app-main">
    <!-- Tab: Tasks -->
    <section id="tab-tasks" class="tab-panel active">
      <div class="task-filters">
        <button class="filter-chip active" data-filter="all">全部</button>
        <button class="filter-chip" data-filter="today">今天</button>
        <button class="filter-chip" data-filter="week">本周</button>
        <button class="filter-chip" data-filter="overdue">逾期</button>
      </div>
      <div id="task-list" class="task-list"></div>
    </section>

    <!-- Tab: Calendar -->
    <section id="tab-calendar" class="tab-panel">
      <div class="view-switcher">
        <button class="view-btn active" data-view="day">日</button>
        <button class="view-btn" data-view="3day">三日</button>
        <button class="view-btn" data-view="week">周</button>
        <button class="view-btn" data-view="weeklist">周列表</button>
        <button class="view-btn" data-view="month">月</button>
      </div>
      <div id="calendar-container" class="calendar-container"></div>
    </section>

    <!-- Tab: Kirby -->
    <section id="tab-kirby" class="tab-panel">
      <div id="kirby-chat" class="kirby-chat">
        <div class="kirby-welcome">
          <svg width="64" height="64" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="28" fill="var(--bg)" stroke="var(--separator)" stroke-width="1.5"/><circle cx="24" cy="28" r="3.5" fill="var(--text)"/><circle cx="40" cy="28" r="3.5" fill="var(--text)"/><path d="M23 38c2.5 5 6.5 7 9 7s6.5-2 9-7" stroke="var(--text)" stroke-width="2" stroke-linecap="round"/></svg>
          <h2>你好，我是卡比!</h2>
          <p>发给我一段安排文字，我帮你提取成日程</p>
          <p class="kirby-hint">请先在设置中配置 API</p>
        </div>
        <div id="kirby-messages" class="kirby-messages"></div>
      </div>
      <div class="kirby-input-area">
        <textarea id="kirby-input" class="kirby-input" placeholder="粘贴安排或输入消息..." rows="1"></textarea>
        <button id="kirby-send" class="kirby-send-btn" aria-label="发送">
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M3.5 10L17 3 10 17v-7H3.5z" fill="currentColor"/></svg>
        </button>
      </div>
    </section>

    <!-- Tab: Settings -->
    <section id="tab-settings" class="tab-panel">
      <div id="settings-main" class="settings-page">
        <div class="settings-group">
          <div class="settings-group-title">通用</div>
          <div class="settings-card">
            <div class="settings-item" data-setting="general">
              <div class="settings-item-left">
                <div class="si-icon blue"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M10 6v4l3 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div>
                <span>通用设置</span>
              </div>
              <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </div>
            <div class="settings-item" data-setting="theme">
              <div class="settings-item-left">
                <div class="si-icon purple"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="14" height="14" rx="3" stroke="currentColor" stroke-width="1.5"/><path d="M3 10h14M10 3v14" stroke="currentColor" stroke-width="1.5"/></svg></div>
                <span>主题</span>
              </div>
              <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </div>
            <div class="settings-item" data-setting="display">
              <div class="settings-item-left">
                <div class="si-icon green"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><rect x="2" y="4" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 17h6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div>
                <span>显示</span>
              </div>
              <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </div>
          </div>
        </div>
        <div class="settings-group">
          <div class="settings-group-title">AI 助手</div>
          <div class="settings-card">
            <div class="settings-item" data-setting="api">
              <div class="settings-item-left">
                <div class="si-icon orange"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M4 7h12M4 13h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="7" r="2" fill="currentColor"/><circle cx="13" cy="13" r="2" fill="currentColor"/></svg></div>
                <span>API 配置</span>
              </div>
              <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </div>
          </div>
        </div>
        <div class="settings-group">
          <div class="settings-group-title">数据</div>
          <div class="settings-card">
            <div class="settings-item" data-setting="data">
              <div class="settings-item-left">
                <div class="si-icon red"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><path d="M4 6h12l-1 10H5L4 6z" stroke="currentColor" stroke-width="1.5"/><path d="M8 3h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div>
                <span>数据管理</span>
              </div>
              <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </div>
          </div>
        </div>
        <div class="settings-group">
          <div class="settings-card">
            <div class="settings-item disabled">
              <div class="settings-item-left">
                <div class="si-icon blue"><svg width="18" height="18" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="currentColor" stroke-width="1.5"/><path d="M10 9v4M10 7h.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></div>
                <span>KirbyDay v1.0</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Sub: General -->
      <div id="settings-general" class="settings-sub hidden">
        <div class="settings-sub-header">
          <button class="settings-back" aria-label="返回"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
          <h2>通用设置</h2>
        </div>
        <div class="settings-card" style="margin-bottom:12px">
          <div class="form-row" style="padding:14px 16px;border-bottom:0.5px solid var(--separator)">
            <label>周起始日</label>
            <select id="setting-week-start" class="form-input" style="width:auto;flex:none">
              <option value="0">周日</option><option value="1" selected>周一</option><option value="6">周六</option>
            </select>
          </div>
          <div class="form-row" style="padding:14px 16px;border-bottom:0.5px solid var(--separator)">
            <label>默认视图</label>
            <select id="setting-default-view" class="form-input" style="width:auto;flex:none">
              <option value="day">日</option><option value="3day">三日</option><option value="week" selected>周</option><option value="weeklist">周列表</option><option value="month">月</option>
            </select>
          </div>
          <div class="form-row" style="padding:14px 16px">
            <label>默认提醒</label>
            <select id="setting-reminder" class="form-input" style="width:auto;flex:none">
              <option value="0">无</option><option value="5">5分钟前</option><option value="15" selected>15分钟前</option><option value="30">30分钟前</option><option value="60">1小时前</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Sub: Theme -->
      <div id="settings-theme" class="settings-sub hidden">
        <div class="settings-sub-header">
          <button class="settings-back" aria-label="返回"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
          <h2>主题</h2>
        </div>
        <div class="theme-grid">
          <div class="theme-card active" data-theme="default"><div class="theme-preview theme-preview-default"></div><span>经典</span></div>
          <div class="theme-card" data-theme="ocean"><div class="theme-preview theme-preview-ocean"></div><span>海洋</span></div>
          <div class="theme-card" data-theme="forest"><div class="theme-preview theme-preview-forest"></div><span>森林</span></div>
        </div>
      </div>

      <!-- Sub: Display -->
      <div id="settings-display" class="settings-sub hidden">
        <div class="settings-sub-header">
          <button class="settings-back" aria-label="返回"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
          <h2>显示</h2>
        </div>
        <div class="toggle-row" style="border-radius:var(--radius-md) var(--radius-md) 0 0">
          <label>深色模式</label>
          <button id="setting-dark-mode" class="toggle-btn" role="switch" aria-checked="false"><span class="toggle-knob"></span></button>
        </div>
        <div class="toggle-row">
          <label>显示农历</label>
          <button id="setting-lunar" class="toggle-btn on" role="switch" aria-checked="true"><span class="toggle-knob"></span></button>
        </div>
        <div class="toggle-row">
          <label>显示节假日</label>
          <button id="setting-holidays" class="toggle-btn on" role="switch" aria-checked="true"><span class="toggle-knob"></span></button>
        </div>
        <div class="toggle-row" style="border-radius:0 0 var(--radius-md) var(--radius-md);border-bottom:none">
          <label>显示周数</label>
          <button id="setting-weeknum" class="toggle-btn" role="switch" aria-checked="false"><span class="toggle-knob"></span></button>
        </div>
      </div>

      <!-- Sub: API -->
      <div id="settings-api" class="settings-sub hidden">
        <div class="settings-sub-header">
          <button class="settings-back" aria-label="返回"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
          <h2>API 配置</h2>
        </div>
        <div class="form-row vertical" style="margin-bottom:12px"><label>API URL</label><input id="setting-api-url" type="url" class="form-input" placeholder="https://api.openai.com/v1"></div>
        <div class="form-row vertical" style="margin-bottom:12px"><label>API Key</label><input id="setting-api-key" type="password" class="form-input" placeholder="sk-..."></div>
        <button id="btn-fetch-models" class="btn-secondary">拉取模型列表</button>
        <div class="form-row vertical" style="margin-bottom:12px"><label>模型</label><select id="setting-model" class="form-input"><option value="">请先拉取模型</option></select></div>
        <button id="btn-save-api" class="btn-primary">保存配置</button>
      </div>

      <!-- Sub: Data Management -->
      <div id="settings-data" class="settings-sub hidden">
        <div class="settings-sub-header">
          <button class="settings-back" aria-label="返回"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
          <h2>数据管理</h2>
        </div>
        <div class="settings-card" style="padding:16px;margin-bottom:16px">
          <div id="storage-info">
            <div style="font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:8px">存储用量</div>
            <div class="storage-meter"><div class="storage-meter-fill" style="width:0%"></div></div>
            <div class="storage-label">计算中...</div>
          </div>
        </div>
        <div class="data-actions">
          <button id="btn-export" class="btn-secondary" style="margin-bottom:0">备份数据</button>
          <button id="btn-import" class="btn-secondary" style="margin-bottom:0">导入数据</button>
          <input type="file" id="import-file" accept=".bck" class="hidden">
          <button id="btn-clear-data" class="btn-danger">清除所有数据</button>
        </div>
      </div>
    </section>
  </main>

  <!-- Add/Edit Task Modal -->
  <div id="modal-task" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-task-title">新建任务</h2>
        <button id="modal-close" class="icon-btn" aria-label="关闭">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M6 6l10 10M16 6L6 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <form id="task-form" class="task-form">
        <input type="hidden" id="task-edit-id" value="">
        <div class="form-row vertical">
          <input id="task-title" type="text" class="form-input" placeholder="任务标题" required>
        </div>
        <div class="form-row vertical">
          <textarea id="task-note" class="form-input form-textarea" placeholder="备注" rows="2"></textarea>
        </div>
        <div class="form-row">
          <label>日期</label>
          <input id="task-date" type="date" class="form-input">
        </div>
        <div class="form-row">
          <label>时间</label>
          <div class="time-row">
            <input id="task-start" type="time" class="form-input">
            <span>—</span>
            <input id="task-end" type="time" class="form-input">
          </div>
        </div>
        <div class="form-row">
          <label>优先级</label>
          <select id="task-priority" class="form-input">
            <option value="0">无</option>
            <option value="1">低</option>
            <option value="2">中</option>
            <option value="3">高</option>
          </select>
        </div>
        <div class="form-row">
          <label>地点</label>
          <input id="task-location" type="text" class="form-input" placeholder="可选">
        </div>
        <div class="form-row">
          <label>颜色</label>
          <div id="color-picker" class="color-picker"></div>
        </div>
        <button type="submit" class="btn-primary form-submit" id="task-submit-btn">保存</button>
        <button type="button" id="task-delete-btn" class="btn-danger hidden" style="margin-top:8px">删除任务</button>
      </form>
    </div>
  </div>

  <!-- Bottom Tab Bar -->
  <nav id="tab-bar" class="tab-bar">
    <button class="tab-item active" data-tab="tasks">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="4" stroke="currentColor" stroke-width="1.5"/><path d="M8 12l2.5 2.5L16 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>任务</span>
    </button>
    <button class="tab-item" data-tab="calendar">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="4" stroke="currentColor" stroke-width="1.5"/><path d="M3 10h18M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>视图</span>
    </button>
    <button class="tab-item" data-tab="kirby">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/><circle cx="9" cy="11" r="1.5" fill="currentColor"/><circle cx="15" cy="11" r="1.5" fill="currentColor"/><path d="M9 15c1 1.5 2.5 2 3 2s2-.5 3-2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>卡比</span>
    </button>
    <button class="tab-item" data-tab="settings">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5.64 5.64l2.12 2.12M16.24 16.24l2.12 2.12M5.64 18.36l2.12-2.12M16.24 7.76l2.12-2.12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>设置</span>
    </button>
  </nav>

  <script src="src/script/storage.js"></script>
  <script src="src/script/holidays.js"></script>
  <script src="src/script/router.js"></script>
  <script src="src/script/tasks.js"></script>
  <script src="src/script/calendar.js"></script>
  <script src="src/script/kirby.js"></script>
  <script src="src/script/settings.js"></script>
  <script src="src/script/app.js"></script>
</body>
</html>
